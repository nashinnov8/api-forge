name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ApiForge.slnx

      - name: Test
        run: dotnet test ApiForge.slnx --no-restore

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/ApiForge.Cli/ApiForge.Cli.csproj -c Release -o ./nupkg -p:PackageVersion=$VERSION

      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: nashinnov8

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source --username nashinnov8 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/nashinnov8/index.json"
          dotnet nuget push ./nupkg/*.nupkg --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
