name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ApiForge.slnx

      - name: Test
        run: dotnet test ApiForge.slnx --no-restore

      - name: Pack
        run: dotnet pack src/ApiForge.Cli/ApiForge.Cli.csproj -c Release -o ./nupkg --no-build

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
